<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concierge</title>
<style>
:root {
  --bg: #f6f3ee; --surface: #fffdf9; --surface-2: #f0ebe3; --ink: #1d1b18; --muted: #6f685e; --line: #e4ddd2;
  --accent: #1f5c4a; --accent-ink: #ffffff; --accent-soft: #e3efe9; --gold: #a07a2c; --warn: #a2471f; --warn-soft: #f7e6dc;
  --shadow: 0 1px 2px rgba(29,27,24,.04), 0 8px 24px rgba(29,27,24,.06);
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #141311; --surface: #1c1b18; --surface-2: #24221e; --ink: #f1ede6; --muted: #a39b8f; --line: #2f2c27;
    --accent: #7cc4a6; --accent-ink: #0f1a16; --accent-soft: #1f2e28; --gold: #d4b26a; --warn: #f0a07a; --warn-soft: #33241c;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
.wrap { max-width: 980px; margin: 0 auto; padding: 32px 20px 80px; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 28px; }
h1 { font: 500 30px/1.1 var(--serif); letter-spacing: -.01em; margin: 0; }
h1 em { font-style: italic; color: var(--gold); }
h2 { font: 500 20px/1.2 var(--serif); margin: 0 0 14px; }
.sub { color: var(--muted); font-size: 13px; }
.wallets { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-bottom: 28px; }
.wallet { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px; box-shadow: var(--shadow); }
.wallet .name { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.wallet .bal { font: 500 28px/1.2 var(--serif); margin-top: 6px; font-variant-numeric: tabular-nums; }
.wallet .delta { color: var(--accent); font-size: 13px; margin-left: 6px; font-family: var(--sans); }
.tabs { display: inline-flex; background: var(--surface-2); border-radius: 999px; padding: 4px; margin-bottom: 18px; }
.tabs button { border: 0; background: transparent; color: var(--muted); padding: 8px 18px; border-radius: 999px; font: 500 14px var(--sans); cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 24px; box-shadow: var(--shadow); margin-bottom: 32px; }
label { display: block; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
textarea, select, input { width: 100%; font: 15px/1.5 var(--sans); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; outline: none; }
textarea:focus, select:focus, input:focus { border-color: var(--accent); }
textarea { min-height: 132px; resize: vertical; }
.row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; margin-top: 14px; }
.actions { display: flex; gap: 10px; align-items: center; margin-top: 18px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 10px 20px; font: 500 14px var(--sans); cursor: pointer; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ghost { background: transparent; }
.btn:disabled { opacity: .5; cursor: default; }
.checks { display: flex; gap: 10px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; cursor: pointer; text-transform: none; letter-spacing: 0; font-size: 14px; color: var(--ink); margin: 0; }
.chip input { width: auto; margin: 0; accent-color: var(--accent); }
.toast { min-height: 20px; font-size: 13px; color: var(--muted); }
.toast.err { color: var(--warn); }
.list-head { display: flex; flex-wrap: wrap; gap: 4px 16px; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
.intent { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 20px; margin-bottom: 14px; box-shadow: var(--shadow); }
.intent-top { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.intent-title { font: 500 17px/1.35 var(--serif); }
.stage { color: var(--muted); font-size: 14px; margin-top: 4px; }
.pill { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; padding: 4px 10px; border-radius: 999px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.pill.you { background: var(--warn-soft); color: var(--warn); }
.pill.ok { background: var(--accent-soft); color: var(--accent); }
.item { margin-top: 18px; }
.item-name { font-weight: 600; margin-bottom: 8px; }
.item-name small { color: var(--muted); font-weight: 400; }
.options { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.opt { text-align: left; border: 1.5px solid var(--line); border-radius: 14px; padding: 12px; background: var(--bg); cursor: pointer; display: flex; gap: 12px; color: var(--ink); font: inherit; }
.opt:hover { border-color: var(--muted); }
.opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.opt img { width: 56px; height: 56px; object-fit: contain; border-radius: 10px; background: #fff; flex: none; }
.opt .ph { width: 56px; height: 56px; border-radius: 10px; background: var(--surface-2); flex: none; }
.opt .b { font-size: 12px; color: var(--gold); letter-spacing: .04em; text-transform: uppercase; }
.opt .n { font-size: 14px; line-height: 1.3; margin: 2px 0 6px; }
.opt .p { font-size: 13px; color: var(--muted); }
.opt .p strong { color: var(--ink); font-weight: 600; }
.badge { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 6px; background: var(--warn-soft); color: var(--warn); margin-left: 4px; }
.tbl { overflow-x: auto; margin: 0 -4px; }
table { width: 100%; border-collapse: collapse; margin-top: 14px; font-variant-numeric: tabular-nums; }
th, td { text-align: right; padding: 10px 8px; border-bottom: 1px solid var(--line); font-size: 14px; }
th:first-child, td:first-child { text-align: left; }
th { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
tr.rec td { font-weight: 600; }
tr.rec td:first-child::after { content: "Recommended"; font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); margin-left: 8px; font-weight: 500; }
.note { margin-top: 12px; font-size: 14px; padding: 10px 14px; background: var(--surface-2); border-radius: 12px; }
.lines { margin: 10px 0 0; padding: 0; list-style: none; font-size: 14px; }
.lines li { display: flex; justify-content: space-between; padding: 4px 0; color: var(--muted); }
details { margin-top: 12px; font-size: 13px; color: var(--muted); }
summary { cursor: pointer; }
.vtable td, .vtable th { font-size: 13px; }
.empty { color: var(--muted); text-align: center; padding: 30px; border: 1px dashed var(--line); border-radius: 18px; }
@media (max-width: 640px) { th, td { padding: 8px 5px; font-size: 13px; } tr.rec td:first-child::after { display: block; margin: 2px 0 0; } .row { grid-template-columns: 1fr; } header { flex-direction: column; } .wrap { padding: 20px 16px 60px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Your <em>concierge</em></h1>
    <div class="sub" id="memo"></div>
  </header>

  <section class="wallets" id="wallets" aria-label="Wallet balances"></section>

  <div class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-tab="buy">Buy items</button>
    <button role="tab" aria-selected="false" data-tab="redeem">Add vouchers to wallets</button>
  </div>

  <section class="panel" id="tab-buy">
    <h2>What do you need?</h2>
    <form id="buyForm">
      <label for="items">Items, one per line</label>
      <textarea id="items" placeholder="Milk 1L x2&#10;Brown eggs 12&#10;Atta 5kg&#10;Greek yogurt" required></textarea>
      <div class="row">
        <div><label for="category">Category</label><select id="category"></select></div>
        <div><label for="app">Preferred app</label><select id="app"><option value="">Best value</option></select></div>
        <div><label for="budget">Budget (₹, optional)</label><input id="budget" type="number" min="0" step="1" inputmode="numeric"></div>
      </div>
      <div class="actions"><button class="btn primary" type="submit">Find the best cart</button><span class="toast" id="buyToast"></span></div>
    </form>
  </section>

  <section class="panel" id="tab-redeem" hidden>
    <h2>Redeem new iShop vouchers</h2>
    <p class="sub">Buy the voucher on iShop. Claude finds the code in your email, adds it to the app wallet and checks the new balance.</p>
    <form id="redeemForm">
      <label>Apps</label>
      <div class="checks" id="redeemApps"></div>
      <div class="actions"><button class="btn primary" type="submit">Redeem vouchers</button><span class="toast" id="redeemToast"></span></div>
    </form>
    <div id="vouchers"></div>
  </section>

  <div class="list-head"><h2>Requests</h2><span class="sub">Ask Claude to “process my intents” to run the queue.</span></div>
  <section id="intents"></section>
</div>

<script>
'use strict';
const $ = (s) => document.querySelector(s);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const inr = (n) => (n == null ? '–' : '₹' + Number(n).toLocaleString('en-IN', { maximumFractionDigits: 2 }));
const safeImg = (u) => (/^https:\/\//.test(u || '') ? u : '');
const ago = (iso) => { if (!iso) return ''; const m = Math.round((Date.now() - new Date(iso)) / 60000); return m < 1 ? 'just now' : m < 60 ? m + 'm ago' : m < 1440 ? Math.round(m / 60) + 'h ago' : Math.round(m / 1440) + 'd ago'; };

let S = null; let lastJson = ''; let appNames = {};
const pending = {}; // intentId -> { itemId: optionId } chosen but not yet sent

const STATUS = {
  queued: ['Queued', ''], running: ['Working', ''], needs_pick: ['Your pick', 'you'], ready_to_compare: ['Comparing', ''],
  needs_approval: ['Approve', 'you'], approved: ['Approved', 'ok'], building_cart: ['Building cart', ''],
  cart_ready: ['Place order', 'you'], done: ['Done', 'ok'], failed: ['Failed', ''], cancelled: ['Cancelled', ''],
};

async function api(path, body) {
  const r = await fetch(path, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : {});
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || 'Request failed');
  return j;
}

function setupForms() {
  appNames = Object.fromEntries(S.apps.map((a) => [a.id, a.name]));
  $('#category').innerHTML = S.categories.map((c) => `<option value="${esc(c)}">${esc(c[0].toUpperCase() + c.slice(1))}</option>`).join('');
  $('#app').innerHTML = '<option value="">Best value</option>' + S.apps.map((a) => `<option value="${esc(a.id)}">${esc(a.name)}</option>`).join('');
  $('#redeemApps').innerHTML = S.apps.map((a) => `<label class="chip"><input type="checkbox" value="${esc(a.id)}" checked> ${esc(a.name)}</label>`).join('');
}

function renderWallets() {
  const ids = S.apps.map((a) => a.id);
  $('#wallets').innerHTML = ids.map((id) => {
    const w = S.wallets[id];
    const delta = w && w.previous != null && w.balance > w.previous ? `<span class="delta">+${inr(w.balance - w.previous)}</span>` : '';
    return `<div class="wallet"><div class="name">${esc(appNames[id] || id)}</div>
      <div class="bal">${w ? inr(w.balance) : '—'}${delta}</div>
      <div class="sub">${w ? 'Checked ' + ago(w.checkedAt) : 'Not checked yet'}</div></div>`;
  }).join('');
  const likes = S.profile.likes.length; const picks = S.profile.picks;
  $('#memo').textContent = picks || likes ? `Remembering ${picks} picks · ${likes} favourite brands` : 'Learning your taste as you shop';
}

function renderVouchers() {
  if (!S.vouchers.length) { $('#vouchers').innerHTML = ''; return; }
  $('#vouchers').innerHTML = `<div class="tbl"><table class="vtable"><thead><tr><th>App</th><th>Code</th><th>Value</th><th>Expiry</th><th>Status</th></tr></thead><tbody>` +
    S.vouchers.map((v) => `<tr><td>${esc(appNames[v.app] || v.app)}</td><td>${esc(v.code)}</td><td>${inr(v.value)}</td><td>${esc(v.expiry || '—')}</td><td>${esc(v.status)}${v.note ? ' · ' + esc(v.note) : ''}</td></tr>`).join('') +
    '</tbody></table></div>';
}

function optionCard(intent, item, o) {
  const chosen = (pending[intent.id] || {})[item.id] || intent.picks[item.id];
  const prices = Object.entries(o.apps).map(([a, p]) => `${esc(appNames[a] || a)} <strong>${inr(p.price)}</strong>${p.unitPrice ? ` <span>(${inr(p.unitPrice)}${esc(p.unit)})</span>` : ''}`).join('<br>');
  const rating = Object.values(o.apps).find((p) => p.rating);
  const img = safeImg(o.image);
  return `<button type="button" class="opt" aria-pressed="${chosen === o.id}" data-intent="${esc(intent.id)}" data-item="${esc(item.id)}" data-opt="${esc(o.id)}">
    ${img ? `<img src="${esc(img)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : '<span class="ph"></span>'}
    <span><span class="b">${esc(o.brand)}</span><div class="n">${esc(o.name)}${o.sizeMismatch ? '<span class="badge">size differs</span>' : ''}</div>
    <div class="p">${esc(o.sizeText)}${rating ? ` · ★ ${esc(rating.rating)}` : ''}<br>${prices}</div></span></button>`;
}

function pickView(i) {
  const items = i.shortlist.items;
  const html = items.map((it) => `<div class="item"><div class="item-name">${esc(it.text)}${it.count > 1 ? ` <small>× ${it.count}</small>` : ''}
      ${i.picks[it.id] && it.autoPick === i.picks[it.id] ? ' <small>· your usual</small>' : ''}</div>
      ${it.options.length ? `<div class="options">${it.options.map((o) => optionCard(i, it, o)).join('')}</div>` : '<div class="sub">Nothing suitable found in either app.</div>'}</div>`).join('');
  const left = items.filter((it) => it.options.length && !((pending[i.id] || {})[it.id] || i.picks[it.id])).length;
  return html + `<div class="actions"><button class="btn primary" data-act="picks" data-id="${esc(i.id)}" ${left ? 'disabled' : ''}>${left ? `Pick ${left} more` : 'Confirm picks'}</button></div>`;
}

function compareView(i, withButtons) {
  const c = i.comparison; if (!c) return '';
  const rows = c.apps.map((a) => a.unavailable
    ? `<tr><td>${esc(appNames[a.app] || a.app)}</td><td colspan="5">${esc(a.reason)}</td></tr>`
    : `<tr class="${a.app === c.recommended ? 'rec' : ''}"><td>${esc(appNames[a.app] || a.app)}</td><td>${inr(a.total)}</td><td>${inr(a.walletUsable)}</td><td>${inr(a.payable)}</td>
       <td>${Math.round(a.coverage * 100)}%${a.substitutions ? ` · ${a.substitutions} swap` : ''}</td><td>${a.etaMins != null ? a.etaMins + ' min' : '—'}</td></tr>`).join('');
  const v = c.voucher;
  const tip = v ? `<div class="note">Wallet is short by ${inr(v.shortfall)}. Buy a ${v.buy.map(inr).join(' + ')} ${esc(appNames[v.app] || v.app)} voucher on iShop${v.saves ? ` (saves ${inr(v.saves)})` : ''}, then redeem it here.</div>` : '';
  const btns = withButtons ? `<div class="actions">${c.apps.filter((a) => !a.unavailable && a.coverage > 0).map((a) =>
    `<button class="btn ${a.app === c.recommended ? 'primary' : ''}" data-act="approve" data-id="${esc(i.id)}" data-app="${esc(a.app)}">Approve ${esc(appNames[a.app] || a.app)}</button>`).join('')}
    <button class="btn ghost" data-act="cancel" data-id="${esc(i.id)}">Cancel</button></div>` : '';
  return `<div class="tbl"><table><thead><tr><th>App</th><th>Total</th><th>Wallet</th><th>You pay</th><th>Items</th><th>ETA</th></tr></thead><tbody>${rows}</tbody></table></div>${tip}${btns}`;
}

function cartView(i) {
  const c = i.cart; if (!c) return '';
  const fees = Object.entries(c.fees || {}).map(([k, v]) => `<li><span>${esc(k)}</span><span>${inr(v)}</span></li>`).join('');
  return `<ul class="lines"><li><span>Items</span><span>${inr(c.subtotal)}</span></li>${fees}<li><span>Wallet applied</span><span>− ${inr(c.walletApplied)}</span></li>
    <li><span><strong>You pay</strong></span><span><strong>${inr(c.payable ?? c.total)}</strong></span></li></ul>
    ${i.status === 'cart_ready' ? `<div class="actions"><button class="btn primary" data-act="placed" data-id="${esc(i.id)}">I placed the order</button></div>` : ''}`;
}

function intentCard(i) {
  const [label, tone] = STATUS[i.status] || [i.status, ''];
  const title = i.type === 'redeem' ? `Redeem vouchers · ${(i.apps.length ? i.apps : S.apps.map((a) => a.id)).map((a) => appNames[a] || a).join(', ')}`
    : i.items.map((x) => x.text).join(', ');
  let body = '';
  if (i.type === 'purchase') {
    if (i.status === 'needs_pick') body = pickView(i);
    else if (i.status === 'needs_approval') body = compareView(i, true);
    else if (['approved', 'building_cart'].includes(i.status)) body = compareView(i, false);
    else if (['cart_ready', 'done'].includes(i.status)) body = cartView(i);
  }
  if (i.type === 'redeem' && i.result) body = `<div class="note">${esc(i.result.summary || '')}</div>`;
  const cancel = ['queued', 'running', 'needs_pick'].includes(i.status) ? `<button class="btn ghost" data-act="cancel" data-id="${esc(i.id)}">Cancel</button>` : '';
  const log = i.log && i.log.length ? `<details><summary>Activity</summary>${i.log.slice().reverse().map((l) => `<div>${esc(ago(l.at))} · ${esc(l.msg)}</div>`).join('')}</details>` : '';
  return `<article class="intent"><div class="intent-top"><div><div class="intent-title">${esc(title)}</div><div class="stage">${esc(i.stage || '')}</div></div>
    <span class="pill ${tone}">${esc(label)}</span></div>${body}${cancel ? `<div class="actions">${cancel}</div>` : ''}${log}</article>`;
}

function renderIntents() {
  $('#intents').innerHTML = S.intents.length ? S.intents.map(intentCard).join('') : '<div class="empty">No requests yet. Add items above.</div>';
}

function render() { renderWallets(); renderVouchers(); renderIntents(); }

async function refresh(force) {
  try {
    const next = await api('/api/state');
    const j = JSON.stringify({ ...next, now: 0 });
    const first = !S; S = next;
    if (first) setupForms();
    if (force || j !== lastJson) { lastJson = j; render(); }
  } catch (e) { /* server restarting; try again next tick */ }
}

document.addEventListener('click', async (e) => {
  const tab = e.target.closest('[data-tab]');
  if (tab) {
    document.querySelectorAll('[data-tab]').forEach((b) => b.setAttribute('aria-selected', String(b === tab)));
    $('#tab-buy').hidden = tab.dataset.tab !== 'buy'; $('#tab-redeem').hidden = tab.dataset.tab !== 'redeem';
    return;
  }
  const opt = e.target.closest('.opt');
  if (opt) { (pending[opt.dataset.intent] ||= {})[opt.dataset.item] = opt.dataset.opt; renderIntents(); return; }
  const btn = e.target.closest('[data-act]');
  if (!btn) return;
  btn.disabled = true;
  const id = btn.dataset.id;
  try {
    if (btn.dataset.act === 'picks') { await api(`/api/intents/${id}/picks`, { picks: pending[id] || {} }); delete pending[id]; }
    if (btn.dataset.act === 'approve') await api(`/api/intents/${id}/approve`, { app: btn.dataset.app });
    if (btn.dataset.act === 'placed') await api(`/api/intents/${id}/placed`, {});
    if (btn.dataset.act === 'cancel') await api(`/api/intents/${id}/cancel`, {});
  } catch (err) { alert(err.message); }
  refresh(true);
});

$('#buyForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const t = $('#buyToast'); t.className = 'toast';
  try {
    await api('/api/intents', { type: 'purchase', items: $('#items').value, category: $('#category').value, preferredApp: $('#app').value, budget: $('#budget').value });
    $('#items').value = ''; $('#budget').value = '';
    t.textContent = 'Queued. Ask Claude to “process my intents”.';
    refresh(true);
  } catch (err) { t.className = 'toast err'; t.textContent = err.message; }
});

$('#redeemForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const t = $('#redeemToast'); t.className = 'toast';
  const apps = [...document.querySelectorAll('#redeemApps input:checked')].map((x) => x.value);
  try { await api('/api/intents', { type: 'redeem', apps }); t.textContent = 'Queued. Ask Claude to “process my intents”.'; refresh(true); }
  catch (err) { t.className = 'toast err'; t.textContent = err.message; }
});

refresh(true);
setInterval(refresh, 3000);
</script>
</body>
</html>
